services:
  postgres:
    # Pinned to 16 deliberately: postgres:18 moved PGDATA to
    # /var/lib/postgresql/18/docker, which would silently orphan the volume
    # below — data vanishes on restart with no error.
    image: postgres:16
    container_name: outboxFanout-postgres
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -U/-d are required: bare pg_isready connects as OS user "root" to a
      # database "root" and logs FATAL errors while still reporting healthy.
      test: ["CMD", "pg_isready", "-U", "${PG_USER}", "-d", "${PG_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      # First run: entrypoint starts a temp server for initdb, stops it, then
      # starts the real one. Connections fail during that gap.
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: outboxFanout-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    # AOF on so the processed:{order_id} dedup keys survive a restart. Still a
    # weaker guarantee than the Postgres consumers: appendfsync everysec can
    # lose ~1s of writes, and the key and the side effect are not in one
    # transaction. Volume survives `down` but not `down -v`.
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  localstack:
    image: localstack/localstack:3
    container_name: outboxFanout-localstack
    ports:
      - "4566:4566"          # single edge port fronting all AWS APIs
    environment:
      SERVICES: sqs,sns      # eager-load hint only; services load lazily anyway
      DEBUG: "0"
    volumes:
      # Does NOT persist topics/queues — that needs PERSISTENCE=1, a paid
      # feature. Caches only the TLS cert, machine id and service catalog.
      # Consequence: every restart wipes the topic, queues and subscriptions,
      # so creating them must be an idempotent bootstrap script.
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 40s      # measured ~20-30s to first healthy response

  order:
    build:
      # Context must be the repo root: the Dockerfile also copies shared/.
      context: .
      dockerfile: order/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Service name, not localhost — inside a container localhost is the
      # container itself.
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DB: ${PG_DB}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SQL_ECHO: ${SQL_ECHO:-0}                            # log every statement
      BREAK_OUTBOX_INSERT: ${BREAK_OUTBOX_INSERT:-0}      # Phase 1 rollback proof
    depends_on:
      postgres:
        # service_healthy, not plain depends_on: a started Postgres still
        # refuses connections during first-run setup.
        condition: service_healthy
    volumes:
      # Dev-only: shadows the code baked into the image so --reload works.
      - ./order:/app/order
      - ./shared:/app/shared
      # Log files on the host so they outlive the container. Works because
      # container appuser and host user are both uid 1000.
      - ./logs:/app/logs
    # --no-access-log: our correlation middleware logs method, path, status
    # and duration with the request id. uvicorn's access line runs outside the
    # middleware, so it would duplicate that with no id attached.
    command: >
      uvicorn order.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log
    # No container_name: allows `docker compose up --scale <svc>=2` later.

  # Not a service — a setup step. It creates the SNS topic, the 3 SQS queues,
  # their policies and the subscriptions, then EXITS. It runs on every `up`
  # because LocalStack forgets every resource on restart, and it is idempotent
  # so re-running costs nothing.
  #
  # Why a container at all, for something that is only setup? Because Compose
  # has exactly one way to express "run this once and prove it finished before
  # starting Y": a container plus `service_completed_successfully`. A
  # healthcheck can only answer "is it alive", never "has it completed".
  #
  # (LocalStack init hooks are the alternative, but /_localstack/health goes
  # green while hooks are still running — so the relay would be released too
  # early — and a shell hook cannot read shared/config.py, so queue names would
  # be duplicated. This is also plain boto3: drop AWS_ENDPOINT_URL and the same
  # script provisions real AWS.)
  bootstrap:
    # Same image as the relay, declared explicitly. Without an `image:` key
    # Compose names images after the SERVICE, so it would build and tag a
    # second identical copy. Naming both the same makes it build once.
    image: outboxfanout-relay
    build:
      context: .
      dockerfile: relay/Dockerfile
    command: python -m bootstrap.main
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      SNS_TOPIC_NAME: ${SNS_TOPIC_NAME:-order-events}
      BILLING_QUEUE_NAME: ${BILLING_QUEUE_NAME:-billing-queue}
      SHIPPING_QUEUE_NAME: ${SHIPPING_QUEUE_NAME:-shipping-queue}
      NOTIFY_QUEUE_NAME: ${NOTIFY_QUEUE_NAME:-notify-queue}
      # Phase 6: one DLQ per queue, plus how many deliveries before SQS gives
      # up and moves a message there.
      BILLING_DLQ_NAME: ${BILLING_DLQ_NAME:-billing-dlq}
      SHIPPING_DLQ_NAME: ${SHIPPING_DLQ_NAME:-shipping-dlq}
      NOTIFY_DLQ_NAME: ${NOTIFY_DLQ_NAME:-notify-dlq}
      SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-5}
      SQS_VISIBILITY_TIMEOUT_SECONDS: ${SQS_VISIBILITY_TIMEOUT_SECONDS:-30}
      SQS_WAIT_TIME_SECONDS: ${SQS_WAIT_TIME_SECONDS:-20}
      # PG_PASSWORD is required by shared/config.py at import, though this
      # script never opens a database connection.
      PG_PASSWORD: ${PG_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      localstack:
        condition: service_healthy
    volumes:
      - ./bootstrap:/app/bootstrap
      - ./shared:/app/shared
      - ./logs:/app/logs

  relay:
    # Shared with the `bootstrap` service above, which runs the same image
    # with a different command.
    image: outboxfanout-relay
    build:
      context: .
      dockerfile: relay/Dockerfile
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DB: ${PG_DB}
      # localstack, not localhost — same container-addressing rule as PG_HOST.
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      # Ignored by LocalStack, but boto3 signs before sending, so absent
      # credentials fail before the request leaves the container.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      SNS_TOPIC_NAME: ${SNS_TOPIC_NAME:-order-events}
      RELAY_POLL_INTERVAL_SECONDS: ${RELAY_POLL_INTERVAL_SECONDS:-2}
      RELAY_BATCH_SIZE: ${RELAY_BATCH_SIZE:-10}
      CRASH_AFTER_PUBLISH: ${CRASH_AFTER_PUBLISH:-0}   # Scenario A
      # Phase 6: failed publish attempts before the relay parks a row and stops
      # selecting it — a dead-letter queue for the outbox table, and the fix for
      # head-of-line blocking.
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SQL_ECHO: ${SQL_ECHO:-0}
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      bootstrap:
        # Waits for bootstrap to EXIT 0, not merely to start. Without it the
        # relay could publish before the queues are subscribed, and those
        # messages would go nowhere — SNS drops a message with no subscribers.
        condition: service_completed_successfully
      # Deliberately NOT depends_on order. The relay reads a table the Order
      # Service creates, but coupling them would mean the relay cannot run
      # while the API is down — the opposite of the independence this split
      # exists to provide. A missing table is logged and retried instead.
    volumes:
      - ./relay:/app/relay
      - ./order:/app/order     # for order.models only
      - ./shared:/app/shared
      - ./logs:/app/logs
    # Default is 10s. Our loop notices SIGTERM within one poll interval, so a
    # shorter grace period keeps `docker compose stop` snappy without ever
    # reaching the SIGKILL that would fake a Scenario A crash.
    stop_grace_period: 5s

  # --- Consumers -------------------------------------------------------------
  # Both use the same idempotency mechanism (a Postgres UNIQUE constraint on
  # order_id) against separate queues and separate tables. Separate images
  # too, though near-identical: independent services must be independently
  # deployable, and neither image contains order/ so neither CAN read the
  # Order Service's tables.

  billing:
    build:
      context: .
      dockerfile: billing/Dockerfile
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DB: ${PG_DB}
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      BILLING_QUEUE_NAME: ${BILLING_QUEUE_NAME:-billing-queue}
      SQS_WAIT_TIME_SECONDS: ${SQS_WAIT_TIME_SECONDS:-20}
      SQS_MAX_MESSAGES: ${SQS_MAX_MESSAGES:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SQL_ECHO: ${SQL_ECHO:-0}
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      bootstrap:
        # The queue must exist before we poll it — aws.queue_url() refuses to
        # create one, so without this the consumer would just log errors.
        condition: service_completed_successfully
      # Deliberately NOT depends_on order or relay. Scenario C requires that a
      # consumer's lifecycle is independent of every other component's.
    volumes:
      - ./billing:/app/billing
      - ./shared:/app/shared
      - ./logs:/app/logs
    # Longer than the relay's 5s because a long poll blocks for up to 20s and
    # cannot be interrupted. A shorter grace period would SIGKILL the consumer
    # mid-wait on every `docker compose stop` — faking a crash on every deploy.
    stop_grace_period: 25s

  shipping:
    build:
      context: .
      dockerfile: shipping/Dockerfile
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DB: ${PG_DB}
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      SHIPPING_QUEUE_NAME: ${SHIPPING_QUEUE_NAME:-shipping-queue}
      SQS_WAIT_TIME_SECONDS: ${SQS_WAIT_TIME_SECONDS:-20}
      SQS_MAX_MESSAGES: ${SQS_MAX_MESSAGES:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SQL_ECHO: ${SQL_ECHO:-0}
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - ./shipping:/app/shipping
      - ./shared:/app/shared
      - ./logs:/app/logs
    stop_grace_period: 25s

  notifications:
    build:
      context: .
      dockerfile: notifications/Dockerfile
    environment:
      # No PG_* at all — this consumer has no database driver in its image.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NOTIFY_DEDUP_TTL_SECONDS: ${NOTIFY_DEDUP_TTL_SECONDS:-172800}
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      NOTIFY_QUEUE_NAME: ${NOTIFY_QUEUE_NAME:-notify-queue}
      SQS_WAIT_TIME_SECONDS: ${SQS_WAIT_TIME_SECONDS:-20}
      SQS_MAX_MESSAGES: ${SQS_MAX_MESSAGES:-10}
      # shared/config.py reads PG_PASSWORD at import even though nothing here
      # opens a connection.
      PG_PASSWORD: ${PG_PASSWORD}
      CRASH_AFTER_MARK: ${CRASH_AFTER_MARK:-0}          # Phase 5 fault injection
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        # Redis, not postgres — the whole point of this consumer.
        condition: service_healthy
      localstack:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - ./notifications:/app/notifications
      - ./shared:/app/shared
      - ./logs:/app/logs
    stop_grace_period: 25s   # long poll blocks up to 20s; see billing

  # No depends_on between postgres/redis/localstack — they are independent.
  # No restart: policies anywhere: auto-restart would undo the fault-injection
  # scenarios (kill the relay mid-loop, take a consumer offline).

volumes:
  postgres-data:
  redis-data:
  localstack-data:
