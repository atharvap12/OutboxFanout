services:
  postgres:
    # Pinned to 16 deliberately: postgres:18 moved PGDATA to
    # /var/lib/postgresql/18/docker, which would silently orphan the volume
    # below — data vanishes on restart with no error.
    image: postgres:16
    container_name: outboxFanout-postgres
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -U/-d are required: bare pg_isready connects as OS user "root" to a
      # database "root" and logs FATAL errors while still reporting healthy.
      test: ["CMD", "pg_isready", "-U", "${PG_USER}", "-d", "${PG_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      # First run: entrypoint starts a temp server for initdb, stops it, then
      # starts the real one. Connections fail during that gap.
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: outboxFanout-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    # AOF on so the processed:{order_id} dedup keys survive a restart. Still a
    # weaker guarantee than the Postgres consumers: appendfsync everysec can
    # lose ~1s of writes, and the key and the side effect are not in one
    # transaction. Volume survives `down` but not `down -v`.
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  localstack:
    image: localstack/localstack:3
    container_name: outboxFanout-localstack
    ports:
      - "4566:4566"          # single edge port fronting all AWS APIs
    environment:
      SERVICES: sqs,sns      # eager-load hint only; services load lazily anyway
      DEBUG: "0"
    volumes:
      # Does NOT persist topics/queues — that needs PERSISTENCE=1, a paid
      # feature. Caches only the TLS cert, machine id and service catalog.
      # Consequence: every restart wipes the topic, queues and subscriptions,
      # so creating them must be an idempotent bootstrap script.
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 40s      # measured ~20-30s to first healthy response

  order:
    build:
      # Context must be the repo root: the Dockerfile also copies shared/.
      context: .
      dockerfile: order/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Service name, not localhost — inside a container localhost is the
      # container itself.
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DB: ${PG_DB}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SQL_ECHO: ${SQL_ECHO:-0}                            # log every statement
      BREAK_OUTBOX_INSERT: ${BREAK_OUTBOX_INSERT:-0}      # Phase 1 rollback proof
    depends_on:
      postgres:
        # service_healthy, not plain depends_on: a started Postgres still
        # refuses connections during first-run setup.
        condition: service_healthy
    volumes:
      # Dev-only: shadows the code baked into the image so --reload works.
      - ./order:/app/order
      - ./shared:/app/shared
      # Log files on the host so they outlive the container. Works because
      # container appuser and host user are both uid 1000.
      - ./logs:/app/logs
    # --no-access-log: our correlation middleware logs method, path, status
    # and duration with the request id. uvicorn's access line runs outside the
    # middleware, so it would duplicate that with no id attached.
    command: >
      uvicorn order.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log
    # No container_name: allows `docker compose up --scale <svc>=2` later.

  # No depends_on between postgres/redis/localstack — they are independent.
  # No restart: policies anywhere: auto-restart would undo the fault-injection
  # scenarios (kill the relay mid-loop, take a consumer offline).

volumes:
  postgres-data:
  redis-data:
  localstack-data:
